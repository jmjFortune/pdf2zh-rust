<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 翻译 · Rust</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1e293b;background:#f5f7fa;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0 0 18px}.muted{color:#64748b;font-size:13px}.badge{background:#e0f2fe;color:#075985;padding:6px 10px;border-radius:20px;font-size:12px}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:24px;box-shadow:0 2px 8px #0f172a04}label{display:block;font-size:13px;margin:16px 0 7px}input,select,textarea{width:100%;font:inherit;font-size:14px;border:1px solid #cbd5e1;border-radius:7px;padding:10px;background:white}input[type=file]{padding:20px 12px;border-style:dashed;background:#f8fafc}input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;outline-offset:2px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,.download{font:inherit;font-size:14px;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;background:#2563eb;color:white;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:wait}.secondary{background:#f1f5f9;color:#334155}.actions{display:flex;gap:10px;margin-top:20px;align-items:center}details{margin-top:20px}summary{font-size:13px;cursor:pointer;color:#475569}progress{width:100%;height:7px;accent-color:#2563eb}#message{white-space:pre-wrap;font-size:14px;line-height:1.6;min-height:22px}.error{color:#b91c1c}.preview-image{width:100%;height:auto;border:1px solid #e2e8f0;border-radius:8px;margin-top:20px}.empty{min-height:350px;display:grid;place-items:center;text-align:center;color:#64748b}#history{margin-top:24px}.job{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid #edf2f7;font-size:13px}.job button{font-size:12px;padding:6px 10px}.job-name{overflow-wrap:anywhere;margin-bottom:5px}.hidden{display:none}footer{font-size:12px;color:#64748b;margin-top:24px;line-height:1.7}input[type=checkbox]{width:auto;margin-right:7px}#keynote{font-size:12px;color:#64748b}@media(max-width:800px){main{padding:20px 14px}.grid{grid-template-columns:1fr}.card{padding:20px}header{align-items:flex-start;gap:12px}.preview-image{height:auto}}
</style>
<main>
<header><div><h1>PDF 翻译</h1><p class="muted">保留公式与图形，生成可搜索的中文 PDF</p></div><span class="badge">Rust · 开发预览</span></header>
<div class="grid">
<section class="card"><h2>开始翻译</h2><form id="form">
<label for="file">PDF 文件</label><input id="file" type="file" accept=".pdf,application/pdf" required>
<div class="row"><div><label for="source">原文语言</label><input id="source" value="en" required></div><div><label for="target">译文语言</label><input id="target" value="zh-CN" required></div></div>
<label for="provider">翻译服务</label><select id="provider"><option value="google">Google</option><option value="openai">兼容 OpenAI 的服务</option><option value="ollama">Ollama</option><option value="deepl">DeepL</option><option value="deeplx">DeepLX</option></select>
<div id="provider-options" class="hidden"><label for="url">服务地址</label><input id="url" type="url" placeholder="https://your-provider.example/v1"><label for="model">模型</label><input id="model" placeholder="服务商提供的模型名称"><label for="key">API Key（可选）</label><input id="key" type="password" autocomplete="off"><p id="keynote">仅用于本次任务，任务完成后删除私有配置。</p></div>
<label for="format">输出格式</label><select id="format"><option value="mono">仅译文</option><option value="side_by_side">原文 / 译文并排</option><option value="interleaved">原文 / 译文交替页</option></select>
<details><summary>页码、密码与术语库</summary><label for="pages">页码范围（留空翻译全文）</label><input id="pages" placeholder="例如：1,3-5"><label for="password">PDF 密码（可选）</label><input id="password" type="password" autocomplete="off"><label for="glossary">术语库 JSON（可选）</label><textarea id="glossary" rows="3" placeholder='{"neural network":"神经网络"}'></textarea><label><input id="layout" type="checkbox" checked>使用版面识别模型</label></details>
<div class="actions"><button type="submit" id="submit">开始翻译</button><button type="button" id="cancel" class="secondary hidden">取消任务</button></div>
</form><footer>当前为独立重写的开发预览。扫描件 OCR、复杂行内公式重排及部分服务商尚未完成。</footer></section>
<section class="card"><h2 id="result-title">翻译结果</h2><progress id="progress" value="0" max="100" class="hidden"></progress><p id="message" role="status" aria-live="polite">选择 PDF 后开始翻译。</p><div class="actions hidden" id="result-actions"><a id="download" class="download" download="translation.pdf">下载译文</a><a id="original" class="download secondary" target="_blank" rel="noopener">查看原文</a></div><div id="empty" class="empty"><p>译文将在这里预览<br><span class="muted">任务进度与结果会保存在历史记录中</span></p></div><div id="page-nav" class="actions hidden"><button type="button" id="previous" class="secondary">上一页</button><span id="page-label" class="muted"></span><button type="button" id="next" class="secondary">下一页</button></div><img id="preview" class="preview-image hidden" alt="翻译后的 PDF 页面预览" loading="lazy"></section>
</div><section class="card" id="history"><h2>最近任务</h2><div id="jobs" class="muted">暂无任务</div></section>
</main>
<script>
const $=id=>document.getElementById(id);let active=null,events=null,previewPage=1,previewTotal=1;
const statusNames={queued:'排队中',running:'翻译中',cancelling:'正在取消',completed:'已完成',failed:'失败',cancelled:'已取消',interrupted:'服务重启，任务中断'};
const stages={layout:'分析版面',translate:'翻译正文',save:'保存 PDF',done:'翻译完成'};
$('provider').onchange=()=>{$('provider-options').classList.toggle('hidden',$('provider').value==='google');};
async function api(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');return data;}
function display(job){if(active!==job.id)previewPage=1;active=job.id;const done=['completed','failed','cancelled','interrupted'].includes(job.status);$('submit').disabled=!done;$('cancel').classList.toggle('hidden',done);$('progress').classList.toggle('hidden',done);$('message').classList.toggle('error',job.status==='failed');
let text=statusNames[job.status]||job.status;if(job.progress&&!done){text+=' · '+(stages[job.progress.stage]||job.progress.stage)+' · 第 '+job.progress.page+'/'+job.progress.total+' 页';$('progress').value=Math.min(95,(job.progress.page-1)/Math.max(job.progress.total,1)*100);}$('message').textContent=job.error||text;
const success=job.status==='completed';$('result-actions').classList.toggle('hidden',!success);$('empty').classList.toggle('hidden',success);$('preview').classList.toggle('hidden',!success);$('page-nav').classList.toggle('hidden',!success);if(success){previewTotal=job.output_pages||1;showPage();$('download').href='/api/jobs/'+job.id+'/output';$('original').href='/api/jobs/'+job.id+'/input';}if(done){events?.close();refresh();}}
function showPage(){const url='/api/jobs/'+active+'/preview/'+previewPage;if($('preview').getAttribute('src')!==url)$('preview').src=url;$('page-label').textContent='第 '+previewPage+' / '+previewTotal+' 页';$('previous').disabled=previewPage<=1;$('next').disabled=previewPage>=previewTotal;}
$('previous').onclick=()=>{if(previewPage>1){previewPage--;showPage();}};
$('next').onclick=()=>{if(previewPage<previewTotal){previewPage++;showPage();}};
$('preview').onerror=()=>{$('message').textContent='页面预览暂时不可用，可以下载完整 PDF 查看。';};
function watch(job){events?.close();display(job);if(!['completed','failed','cancelled','interrupted'].includes(job.status)){events=new EventSource('/api/jobs/'+job.id+'/events');events.addEventListener('job',event=>display(JSON.parse(event.data)));}}
$('form').onsubmit=async event=>{event.preventDefault();try{$('submit').disabled=true;$('message').textContent='正在上传 PDF…';$('message').classList.remove('error');const glossary=$('glossary').value.trim()?JSON.parse($('glossary').value):{};const options={translation:{provider:$('provider').value,source:$('source').value,target:$('target').value,base_url:$('url').value,model:$('model').value,api_key:$('key').value||null,glossary},pages:$('pages').value,format:$('format').value,layout:$('layout').checked,password:$('password').value||null};const form=new FormData();form.append('file',$('file').files[0]);form.append('options',JSON.stringify(options));const job=await api('/api/jobs',{method:'POST',body:form});$('key').value='';$('password').value='';watch(job);refresh();}catch(error){$('message').textContent=error.message;$('message').classList.add('error');$('submit').disabled=false;}};
$('cancel').onclick=async()=>{try{display(await api('/api/jobs/'+active+'/cancel',{method:'POST'}));}catch(error){$('message').textContent=error.message;}};
async function refresh(){try{const jobs=await api('/api/jobs');$('jobs').replaceChildren();if(!jobs.length){$('jobs').textContent='暂无任务';return;}for(const job of jobs){const row=document.createElement('div');row.className='job';const detail=document.createElement('div'),name=document.createElement('div'),status=document.createElement('span');name.className='job-name';name.textContent=job.filename;status.className='muted';status.textContent=(statusNames[job.status]||job.status)+' · '+new Date(job.created*1000).toLocaleString();detail.append(name,status);const button=document.createElement('button');button.className='secondary';button.textContent='查看';button.onclick=()=>watch(job);row.append(detail,button);$('jobs').append(row);}}catch(error){$('jobs').textContent=error.message;}}
refresh();
</script>
</html>
